<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>YA</title>
<style>
  :root{
    --bg:#1b1330;
    --bg-alt:#271c40;
    --card:#2a1f45;
    --card-border:#43335f;
    --ink:#f6f2ff;
    --ink-dim:#b6a8d8;
    --ember:#ffb454;
    --ember-hot:#ff5470;
    --moss:#4cc9a0;
    --violet:#a78bfa;
    --ring-track:#382a52;
    --radius:22px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  body{ background:radial-gradient(130% 100% at 50% -10%, #3c2a5e 0%, var(--bg) 55%); }
  #app{
    max-width:480px;margin:0 auto;height:100dvh;
    display:flex;flex-direction:column;
    padding:calc(10px + var(--safe-t)) calc(14px + var(--safe-r)) calc(10px + var(--safe-b)) calc(14px + var(--safe-l));
    position:relative;overflow:hidden;
  }
  .screen{display:flex;flex-direction:column;flex:1;min-height:0;animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- topbar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink-dim);padding:2px 2px 6px 2px;gap:6px;}
  .topbar .pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--card-border);padding:5px 10px;border-radius:999px;font-weight:700;}
  .topbar-side{display:flex;gap:6px;}
  .icon-btn{background:var(--card);border:1px solid var(--card-border);color:var(--ink-dim);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;cursor:pointer;flex:0 0 auto;}
  .icon-btn:active{transform:scale(.92);}

  /* ---------- config screen ---------- */
  h1.brand{font-size:27px;margin:4px 0 2px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(90deg,var(--ember),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--ink-dim);font-size:13.5px;margin:0 0 16px;}
  .config-scroll{flex:1;overflow-y:auto;padding-bottom:8px;}
  label.field-label{font-size:12.5px;color:var(--ink-dim);font-weight:700;margin:14px 0 6px;display:block;text-transform:uppercase;letter-spacing:.04em;}
  input[type=number], input[type=text]{width:100%;background:var(--card);border:1px solid var(--card-border);color:var(--ink);border-radius:14px;padding:13px 15px;font-size:15.5px;outline:none;}
  input:focus{border-color:var(--ember);}
  .stepper{display:flex;align-items:center;gap:14px;}
  .stepper button{width:42px;height:42px;border-radius:13px;border:1px solid var(--card-border);background:var(--card);color:var(--ink);font-size:19px;font-weight:700;cursor:pointer;}
  .stepper button:active{transform:scale(.94);}
  .stepper .count{font-size:20px;font-weight:800;min-width:44px;text-align:center;}
  .name-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .name-row{display:flex;align-items:center;gap:10px;}
  .name-row .num{width:24px;height:24px;border-radius:50%;background:var(--card-border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-dim);flex:0 0 auto;}
  .grow{flex:1;}
  .primary-btn{background:linear-gradient(135deg,var(--ember),var(--ember-hot));color:#1a1108;border:none;border-radius:16px;padding:15px;font-size:15.5px;font-weight:800;letter-spacing:.01em;cursor:pointer;width:100%;margin-top:14px;}
  .primary-btn:active{transform:scale(.98);}
  .primary-btn:disabled{opacity:.4;}
  .ghost-btn{background:transparent;border:1px solid var(--card-border);color:var(--ink-dim);border-radius:14px;padding:12px;font-size:13.5px;font-weight:700;margin-top:8px;cursor:pointer;width:100%;}
  .error-msg{color:var(--ember-hot);font-size:12.5px;margin-top:6px;min-height:14px;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:11px 13px;margin-bottom:8px;}
  .mode-toggle{display:flex;gap:8px;margin-bottom:4px;}
  .mode-opt{flex:1;background:var(--card);border:1px solid var(--card-border);color:var(--ink-dim);border-radius:14px;padding:12px 6px;font-size:12.5px;font-weight:800;cursor:pointer;}
  .mode-opt.active{color:var(--ink);border-color:var(--moss);background:var(--bg-alt);box-shadow:0 0 0 2px rgba(76,201,160,.25);}
  .mode-opt:active{transform:scale(.97);}
  .toggle-row .t-label{font-size:13px;font-weight:700;}
  .toggle-row .t-desc{font-size:11px;color:var(--ink-dim);margin-top:2px;line-height:1.35;}
  .switch{width:42px;height:25px;border-radius:999px;background:var(--ring-track);position:relative;flex:0 0 auto;transition:background .2s ease;cursor:pointer;}
  .switch.on{background:var(--moss);}
  .switch .knob{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .2s ease;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch.on .knob{left:19px;}

  /* ---------- table (jeu) ---------- */
  .table-wrap{
    position:relative;width:min(52vw,205px);aspect-ratio:1;margin:2px auto 0;
    border-radius:50%;
    background:radial-gradient(circle at 50% 38%, #38295c 0%, var(--bg-alt) 72%);
    border:1px solid var(--card-border);
    box-shadow:inset 0 0 0 5px #201735, 0 0 24px rgba(167,139,250,.12);
  }
  .table-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;pointer-events:none;}
  .table-center .center-dir{font-size:19px;display:inline-block;}
  .table-center .center-round{font-size:9px;color:var(--ink-dim);font-weight:700;letter-spacing:.05em;margin-top:1px;}
  .non-btn{background:linear-gradient(135deg,var(--ember-hot),#8f1830);color:#fff;border:none;border-radius:50%;width:42px;height:42px;font-size:11px;font-weight:800;letter-spacing:.02em;cursor:pointer;box-shadow:0 0 0 3px rgba(255,84,112,.22), 0 0 10px rgba(255,84,112,.35);pointer-events:auto;}
  .non-btn:active{transform:scale(.9);}
  .seat{position:absolute;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;min-width:30px;min-height:30px;border-radius:50%;background:var(--card);border:1.5px solid var(--card-border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--ink-dim);transition:border-color .2s ease, box-shadow .2s ease, opacity .2s ease, background .2s ease;}
  .seat .badge{position:absolute;bottom:-5px;right:-5px;font-size:8.5px;background:var(--bg);border:1px solid var(--card-border);border-radius:8px;padding:0 3px;color:var(--ember);font-weight:800;}
  .seat.holder{color:var(--ink);background:var(--bg-alt);border-color:var(--ember);box-shadow:0 0 0 4px rgba(255,180,84,.18), 0 0 14px rgba(255,180,84,.35);animation:pulseSeat 1.4s ease-in-out infinite;}
  .seat.out{opacity:.28;background:var(--bg);}
  .seat.out::after{content:'✕';position:absolute;font-size:13px;color:var(--ember-hot);}
  .seat.clickable{cursor:pointer;box-shadow:0 0 0 4px rgba(76,201,160,.2);border-color:var(--moss);animation:pulseTarget 1.1s ease-in-out infinite;}
  .seat.launcher-tag::before{content:'🫎';position:absolute;top:-15px;font-size:10px;}
  @keyframes pulseSeat{0%,100%{box-shadow:0 0 0 4px rgba(255,180,84,.18),0 0 14px rgba(255,180,84,.35);}50%{box-shadow:0 0 0 7px rgba(255,180,84,.1),0 0 20px rgba(255,180,84,.5);}}
  @keyframes pulseTarget{0%,100%{box-shadow:0 0 0 4px rgba(76,201,160,.2);}50%{box-shadow:0 0 0 8px rgba(76,201,160,.05);}}
  .ball-token{position:absolute;transform:translate(-50%,-50%);font-size:18px;z-index:5;filter:drop-shadow(0 0 6px rgba(255,180,84,.6));pointer-events:none;}
  .ball-token.blur{filter:blur(1px) drop-shadow(0 0 10px rgba(255,84,112,.8));}
  .spark{position:absolute;transform:translate(-50%,-50%);font-size:12px;pointer-events:none;opacity:.9;animation:sparkFade .5s ease forwards;}
  @keyframes sparkFade{to{opacity:0;transform:translate(-50%,-50%) scale(.4);}}

  /* ---------- holder / caption ---------- */
  .holder-strip{text-align:center;margin-top:2px;}
  .holder-name{font-size:clamp(17px,5.8vw,22px);font-weight:800;letter-spacing:-.01em;}
  .holder-sub{font-size:10.5px;color:var(--ink-dim);font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
  .timer-bar-wrap{width:76%;max-width:210px;height:5px;border-radius:999px;background:var(--ring-track);overflow:hidden;margin:6px auto 0;}
  .timer-bar-wrap i{display:block;height:100%;width:100%;background:var(--ember);}
  .caption{min-height:16px;text-align:center;font-size:12px;font-weight:600;color:var(--ember);margin:5px 0 0;padding:0 6px;}
  .caption.last{color:var(--ink-dim);font-weight:500;}

  /* ---------- actions ---------- */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px;}
  .actions.malus-shake{animation:malusShake .35s ease-in-out infinite;}
  @keyframes malusShake{
    0%,100%{transform:translate(0,0) rotate(0);}
    20%{transform:translate(-3px,2px) rotate(-1deg);}
    40%{transform:translate(3px,-2px) rotate(1deg);}
    60%{transform:translate(-2px,1px) rotate(-.5deg);}
    80%{transform:translate(2px,-1px) rotate(.5deg);}
  }
  .actions .full{grid-column:1 / -1;}
  .action-btn{background:var(--card);border:1px solid var(--card-border);border-radius:15px;padding:7px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink);}
  .icon-chip{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:1px;}
  .chip-ya{background:radial-gradient(circle at 30% 28%, #ffe2ad, var(--ember));}
  .chip-ouzbeb{background:radial-gradient(circle at 30% 28%, #d9caff, var(--violet));}
  .chip-doume{background:radial-gradient(circle at 30% 28%, #ffb4c0, var(--ember-hot));}
  .chip-feu{background:radial-gradient(circle at 30% 28%, #ffd08a, #ff5e3d);}
  .chip-caribou{background:radial-gradient(circle at 30% 28%, #bdf6df, var(--moss));}
  .action-btn .emo{font-size:18px;display:inline-block;transition:transform .2s ease;}
  .action-btn .lbl{font-size:11px;font-weight:800;color:var(--ink);}
  .action-btn .sub-hand{font-size:9px;font-weight:600;color:var(--ink-dim);}
  .icon-chip{position:relative;}
  .arrow-badge{position:absolute;bottom:-4px;right:-4px;font-size:11px;background:var(--bg);border-radius:8px;padding:0 2px;line-height:1.3;}
  .action-btn:active{transform:scale(.95);background:var(--bg-alt);}
  .action-btn.disabled{opacity:.32;pointer-events:none;}
  .tilt-right{transform:rotate(45deg);}
  .tilt-left{transform:rotate(-45deg);}
  .mirror{display:inline-block;transform:scaleX(-1);}

  /* ---------- premier coup imposé ---------- */
  .first-move-note{text-align:center;font-size:12px;color:var(--ink-dim);margin-top:8px;}

  /* ---------- interrupt (caribou) ---------- */
  .interrupt-text{text-align:center;margin-top:4px;}
  .interrupt-text h2{font-size:17px;margin:2px 0;font-weight:800;}
  .interrupt-text p{color:var(--ink-dim);font-size:12.5px;margin:0;}

  /* ---------- écran combiné de confirmation Caribou ---------- */
  .caribou-stage{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:12px;flex:1;min-height:0;}
  .car-side{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;}
  .car-name{font-size:12px;font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
  .car-icon{font-size:28px;opacity:0;transform:translateX(0);transition:opacity .5s ease, transform .5s cubic-bezier(.22,.9,.32,1.1);}
  .car-icon.from-left{transform:translateX(-34px) scaleX(-1);}
  .car-icon.from-right{transform:translateX(34px);}
  .car-icon.arrived{opacity:1;}
  .car-icon.from-left.arrived{transform:translateX(0) scaleX(-1);}
  .car-icon.from-right.arrived{transform:translateX(0);}
  .car-btn{background:var(--moss);color:#082019;border:none;border-radius:14px;padding:10px 6px;font-size:11px;font-weight:800;cursor:pointer;width:100%;max-width:110px;}
  .car-btn:active{transform:scale(.95);}
  .car-check{font-size:11px;color:var(--moss);font-weight:800;opacity:0;transition:opacity .3s ease;}
  .car-check.show{opacity:1;}
  .car-center{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:0 2px;}
  .car-caribou{font-size:clamp(38px,11vw,54px);filter:drop-shadow(0 0 14px rgba(255,180,84,.4));}
  .car-launcher-lbl{font-size:9px;color:var(--ink-dim);text-transform:uppercase;font-weight:700;letter-spacing:.05em;}
  .car-launcher-name{font-size:12.5px;font-weight:800;}
  .confirm-btn{display:block;margin:12px auto 0;background:var(--moss);color:#082019;border:none;border-radius:18px;padding:15px 22px;font-size:14.5px;font-weight:800;cursor:pointer;}
  .confirm-btn:active{transform:scale(.96);}
  .hint-tap{text-align:center;color:var(--ink-dim);font-size:11.5px;margin-top:8px;}

  /* ---------- scoreboard ---------- */
  .scoreboard-toggle{margin-top:auto;background:none;border:none;color:var(--ink-dim);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:5px;}
  .scoreboard{margin-top:1px;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:6px;max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .scoreboard.open{max-height:220px;overflow-y:auto;}
  .score-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:3px 0;}
  .score-row.out{opacity:.4;}
  .score-name{display:flex;align-items:center;gap:8px;font-weight:600;}
  .score-beers{color:var(--ember);font-weight:700;font-size:12px;}

  /* ---------- round end ---------- */
  .end-list{width:100%;display:flex;flex-direction:column;gap:8px;margin:16px 0;overflow-y:auto;flex:1;}
  .end-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:11px 15px;}
  .end-row.winner{border-color:var(--moss);}
  .crown{font-size:16px;}

  /* ---------- overlays plein écran : Caribou scellé / élimination ---------- */
  .seal-overlay, .loss-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;animation:overlayIn .18s ease forwards;}
  .seal-overlay{background:radial-gradient(circle at 50% 45%, rgba(56,41,92,.97) 0%, rgba(12,9,20,.99) 70%);}
  .loss-overlay{background:radial-gradient(circle at 50% 40%, rgba(90,30,40,.97) 0%, rgba(10,8,12,.99) 70%);}
  .seal-overlay.leaving, .loss-overlay.leaving{animation:overlayOut .3s ease forwards;}
  .seal-cluster{position:relative;display:flex;align-items:center;justify-content:center;}
  .seal-caribou{font-size:min(30vw,140px);filter:drop-shadow(0 0 26px rgba(255,180,84,.55));position:relative;z-index:2;}
  .seal-char{font-size:min(15vw,70px);position:absolute;top:50%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));}
  .seal-char.left{left:50%;transform:translate(calc(-120vw - 50%),-50%) scaleX(-1);animation:slideInLeft .65s cubic-bezier(.22,.9,.32,1.1) forwards;animation-delay:.05s;}
  .seal-char.right{left:50%;transform:translate(calc(120vw - 50%),-50%);animation:slideInRight .65s cubic-bezier(.22,.9,.32,1.1) forwards;animation-delay:.2s;}
  .seal-cluster.sealed{animation:sealShake .5s ease;}
  .seal-caption{position:absolute;bottom:16%;left:0;right:0;text-align:center;color:var(--ink);font-weight:800;font-size:15px;opacity:0;letter-spacing:.02em;}
  .seal-caption.show{animation:capFadeIn .35s ease forwards;}
  @keyframes overlayIn{from{opacity:0}to{opacity:1}}
  @keyframes overlayOut{from{opacity:1}to{opacity:0}}
  @keyframes slideInLeft{0%{transform:translate(calc(-120vw - 50%),-50%) scaleX(-1) scale(.7) rotate(-8deg);opacity:0;}70%{transform:translate(calc(-46px - 50%),-50%) scaleX(-1) scale(1.05) rotate(4deg);opacity:1;}100%{transform:translate(calc(-38px - 50%),-50%) scaleX(-1) scale(1) rotate(0deg);opacity:1;}}
  @keyframes slideInRight{0%{transform:translate(calc(120vw - 50%),-50%) scale(.7) rotate(8deg);opacity:0;}70%{transform:translate(calc(46px - 50%),-50%) scale(1.05) rotate(-4deg);opacity:1;}100%{transform:translate(calc(38px - 50%),-50%) scale(1) rotate(0deg);opacity:1;}}
  @keyframes sealShake{0%,100%{transform:translate(0,0) rotate(0);}15%{transform:translate(-6px,3px) rotate(-2.5deg);}30%{transform:translate(5px,-3px) rotate(2.5deg);}45%{transform:translate(-4px,2px) rotate(-1.5deg);}60%{transform:translate(4px,-2px) rotate(1.5deg);}75%{transform:translate(-2px,1px) rotate(-1deg);}90%{transform:translate(2px,0) rotate(.5deg);}}
  @keyframes capFadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .loss-cluster{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:0 24px;}
  .loss-emoji{font-size:min(28vw,120px);animation:dropBounce .75s cubic-bezier(.36,0,.66,-0.3) forwards;filter:drop-shadow(0 10px 12px rgba(0,0,0,.4));}
  .loss-name{font-size:20px;font-weight:800;color:var(--ink);opacity:0;animation:capFadeIn .35s ease forwards;animation-delay:.7s;}
  .loss-reason{font-size:13.5px;font-style:italic;color:var(--ink-dim);opacity:0;animation:capFadeIn .35s ease forwards;animation-delay:.85s;max-width:280px;}
  .loss-beer{margin-top:4px;font-size:13px;font-weight:800;color:var(--ember);opacity:0;animation:capFadeIn .35s ease forwards;animation-delay:1s;}
  .overlay-continue-btn{margin-top:18px;background:linear-gradient(135deg,var(--ember),var(--ember-hot));color:#1a1108;border:none;border-radius:16px;padding:14px 22px;font-size:14px;font-weight:800;cursor:pointer;opacity:0;animation:capFadeIn .35s ease forwards;animation-delay:1.2s;}
  .overlay-continue-btn:active{transform:scale(.96);}
  .loss-btn-row{display:flex;gap:10px;margin-top:18px;align-items:center;}
  .loss-btn-row .overlay-continue-btn{margin-top:0;}
  .overlay-contest-btn{margin-top:0;background:transparent;border:1.5px solid var(--card-border);color:var(--ink-dim);border-radius:16px;padding:14px 16px;font-size:12.5px;font-weight:800;cursor:pointer;opacity:0;animation:capFadeIn .35s ease forwards;animation-delay:1.2s;}
  .overlay-contest-btn:active{transform:scale(.96);}
  .contest-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px;max-width:300px;width:100%;}
  .contest-target{background:var(--card);border:1px solid var(--card-border);color:var(--ink);border-radius:14px;padding:12px 8px;font-size:13px;font-weight:700;cursor:pointer;}
  .contest-target:active{transform:scale(.95);}
  .overlay-cancel-btn{margin-top:14px;background:transparent;border:1px solid var(--card-border);color:var(--ink-dim);border-radius:14px;padding:11px 22px;font-size:13px;font-weight:700;cursor:pointer;}
  .overlay-cancel-btn:active{transform:scale(.96);}
  @keyframes dropBounce{
    0%{transform:translateY(-180%) scale(.6) rotate(-15deg);opacity:0;}
    55%{transform:translateY(6%) scale(1.15) rotate(8deg);opacity:1;}
    70%{transform:translateY(-4%) scale(.95) rotate(-4deg);}
    85%{transform:translateY(2%) scale(1.03) rotate(2deg);}
    100%{transform:translateY(0) scale(1) rotate(0);}
  }

  /* ---------- victoire de manche ---------- */
  .victory-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;animation:overlayIn .18s ease forwards;background:radial-gradient(circle at 50% 40%, rgba(76,140,90,.55) 0%, rgba(15,12,10,.98) 70%);overflow:hidden;}
  .victory-overlay.leaving{animation:overlayOut .3s ease forwards;}
  .victory-cluster{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px;}
  .victory-trophy{font-size:min(30vw,130px);animation:trophyPop .7s cubic-bezier(.34,1.56,.64,1) forwards;filter:drop-shadow(0 10px 16px rgba(0,0,0,.4));}
  .victory-name{font-size:24px;font-weight:800;color:var(--ink);margin-top:6px;opacity:0;animation:capFadeIn .35s ease forwards;animation-delay:.55s;}
  .victory-sub{font-size:14px;font-weight:700;color:var(--ember);opacity:0;animation:capFadeIn .35s ease forwards;animation-delay:.7s;}
  .confetti-layer{position:absolute;inset:0;pointer-events:none;z-index:1;}
  .confetti{position:absolute;top:-10%;font-size:22px;animation-name:confettiFall;animation-timing-function:ease-in;animation-fill-mode:forwards;}
  @keyframes trophyPop{0%{transform:scale(0) rotate(-20deg);opacity:0;}60%{transform:scale(1.2) rotate(6deg);opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}
  @keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(115vh) rotate(360deg);opacity:.9;}}

  /* ---------- décompte 3-2-1 ---------- */
  .countdown-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;animation:overlayIn .15s ease forwards;background:radial-gradient(circle at 50% 45%, rgba(56,41,92,.97) 0%, rgba(10,8,14,.99) 70%);}
  .countdown-overlay.leaving{animation:overlayOut .25s ease forwards;}
  .countdown-cluster{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .countdown-player{font-size:16px;font-weight:800;color:var(--ink);text-align:center;padding:0 20px;opacity:0;animation:capFadeIn .4s ease forwards;}
  .countdown-number{font-size:min(34vw,150px);font-weight:800;color:var(--ember);text-align:center;padding:0 20px;filter:drop-shadow(0 0 20px rgba(255,180,84,.5));animation:countdownPop .65s cubic-bezier(.22,.9,.32,1.1);}
  .countdown-number.go{font-size:min(12vw,44px);color:var(--moss);filter:drop-shadow(0 0 16px rgba(76,201,160,.5));}
  @keyframes countdownPop{
    0%{transform:scale(.3);opacity:0;}
    25%{transform:scale(1.15);opacity:1;}
    45%{transform:scale(1);opacity:1;}
    82%{transform:scale(1);opacity:1;}
    100%{transform:scale(.75);opacity:0;}
  }

  /* ---------- modal règles ---------- */
  .modal-overlay{position:fixed;inset:0;z-index:9998;background:rgba(8,6,14,.72);display:flex;align-items:center;justify-content:center;padding:20px;animation:overlayIn .15s ease;}
  .modal-card{background:var(--card);border:1px solid var(--card-border);border-radius:20px;max-width:400px;width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;}
  .modal-head h2{margin:0;font-size:18px;font-weight:800;}
  .modal-body{padding:0 18px 18px;overflow-y:auto;font-size:13.5px;line-height:1.5;color:var(--ink-dim);}
  .modal-body p{margin:0 0 10px;}
  .modal-body b{color:var(--ink);}
  .modal-body hr{border:none;border-top:1px solid var(--card-border);margin:12px 0;}
  .modal-body ul{margin:6px 0 0;padding-left:18px;}
  .modal-body li{margin-bottom:6px;}

  @media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important;} }
</style>

<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ============================================================
   CONFIG — modifiable ici
   ============================================================ */
var ACTION_ANIM_MS  = 260;     // ms — durée de l'animation Ya / Ouzbeb / Doumé (raccourcie pour la fluidité)
var FIRE_ANIM_MS     = 420;    // ms — durée de l'animation Boule de feu
var CAPTION_HOLD_MS  = 0;      // ms — plus de pause artificielle : le tour suivant démarre dès l'arrivée du jeton
var SEAL_ARRIVE_MS   = 900;
var SEAL_SHAKE_MS    = 500;
var SEAL_HOLD_MS     = 550;
var SEAL_FADE_MS     = 300;
var LOSS_FADE_MS     = 300;
var MIN_PLAYERS = 2;
var WINS_TO_WIN_GAME = 6;
var MAX_TIMER_S = 15, DEFAULT_TIMER_S = 5;
var TIMER_STEPS = [0.25, 0.5, 0.75];
(function(){ for(var s=1; s<=MAX_TIMER_S; s++) TIMER_STEPS.push(s); })();

var RULE_DEFS = [
  {key:'noDoumeOnDoume', label:'Pas de Doumé sur un Doumé', desc:'Rejouer un Doumé juste après un Doumé élimine le joueur.'},
  {key:'noOuzbebOnDoume', label:'Pas de Ouzbeb sur un Doumé', desc:'Faire un Ouzbeb juste après un Doumé élimine le joueur.'},
  {key:'handRule', label:'Bon côté : Ya, Doumé, Boule de feu', desc:'Le Ya, le Doumé et la Boule de feu doivent être joués du bon côté (gauche/droite) selon le sens de la balle, sous peine d\'élimination.'},
  {key:'onlyYaAfterCaribou', label:'Seul un Ya après un Caribou', desc:'Après un Caribou, toute action autre qu\'un Ya (Ouzbeb, Doumé, Boule de feu, Caribou) élimine le joueur.'},
  {key:'malusEnabled', label:'Malus progressifs', desc:'Le gagnant de chaque manche désigne un joueur qui monte d\'un palier de malus (flou, vibration, boutons mélangés).'}
];

var SARCASTIC_TIMEOUT = [
  '{name} a pris le temps de réfléchir à la vie. Trop de temps.',
  '{name} attendait visiblement l\'inspiration divine.',
  'Le téléphone a dû fondre dans les mains de {name}.',
  '{name} a préféré compter les moutons plutôt que jouer.',
  'Un escargot aurait été plus rapide que {name}.',
  '{name} était en train de calculer sa retraite.'
];
var SARCASTIC_DOUME_ON_DOUME = [
  '{name} a fait un Doumé sur un Doumé. Le règlement, ça se lit parfois.',
  'Contre-attaquer une contre-attaque ? {name} vient d\'inventer une nouvelle façon de perdre.'
];
var SARCASTIC_OUZBEB_ON_DOUME = [
  '{name} a tenté un Ouzbeb juste après un Doumé. Mauvaise pioche.',
  '{name} n\'a clairement pas suivi le débriefing des règles.'
];
var SARCASTIC_WRONG_HAND = [
  '{name} a joué {action} de la mauvaise main. Le geste ne suit pas le sens de la balle.',
  '{name} a confondu sa gauche et sa droite sur ce {action}. Classique.',
  'Mauvais bras, {name} ! Ce {action} ne compte pas.',
  '{name} a improvisé sa propre version du {action}. Ça ne passe pas.'
];
var SARCASTIC_CARIBOU_ONLY = [
  '{name} a tenté un {action} juste après un Caribou. Seul un Ya était autorisé.',
  'Après un Caribou, on ne joue que Ya. {name} vient de l\'apprendre à ses dépens.',
  '{name} n\'a pas respecté le calme après le Caribou. Sanction immédiate.'
];
function pick(arr,name){ var s = arr[Math.floor(Math.random()*arr.length)]; return s.replace('{name}', name); }
function sarcasticWrongHand(name, actionLabel){
  var s = SARCASTIC_WRONG_HAND[Math.floor(Math.random()*SARCASTIC_WRONG_HAND.length)];
  return s.replace('{name}', name).replace('{action}', actionLabel);
}
function sarcasticCaribouOnly(name, actionLabel){
  var s = SARCASTIC_CARIBOU_ONLY[Math.floor(Math.random()*SARCASTIC_CARIBOU_ONLY.length)];
  return s.replace('{name}', name).replace('{action}', actionLabel);
}
/* Renvoie true (et élimine le joueur) si la règle "seul un Ya après un Caribou" est active
   et vient d'être enfreinte par l'action en cours. */
function checkOnlyYaAfterCaribou(actionLabel){
  if(state.rules.onlyYaAfterCaribou && state.lastActionType === 'caribou'){
    loseTurn(state.current, sarcasticCaribouOnly(firstName(state.current), actionLabel));
    return true;
  }
  return false;
}

/* Convention géométrique : le siège i est placé à l'angle (-90 + i*360/N) degrés.
   "i croissant" tourne VISUELLEMENT dans le sens horaire (axe Y de l'écran vers le bas).
   state.direction = +1 => horaire, -1 => anti-horaire. */

var state = {
  screen: 'config',
  players: [],
  direction: 1,
  current: 0,
  caribou: null,
  scoreboardOpen: false,
  roundNumber: 1,
  lastActionText: '',
  lastActionType: null,
  lastActionEmoji: '',
  lastActionTilt: '',
  lastActionMirror: false,
  awaitingFirstYa: true,
  rules: { noDoumeOnDoume:true, noOuzbebOnDoume:true, handRule:true, onlyYaAfterCaribou:true, malusEnabled:true },
  timerSeconds: DEFAULT_TIMER_S,
  displayMode: 'fixed' // 'fixed' = table fixe (défaut) | 'rotate' = joueur actif toujours en bas
};

var timerHandle = null;
var timerRaf = null;
var timerPaused = false;
var timerRemainingMs = 0;
var timerBarElCurrent = null;
var timerOnExpireCurrent = null;
var app = document.getElementById('app');

/* ============================================================
   HELPERS — state machine
   ============================================================ */
function activePositions(){
  var res = [];
  for(var i=0;i<state.players.length;i++){ if(!state.players[i].eliminated) res.push(i); }
  return res;
}
function stepFrom(index, steps, dir){
  var active = activePositions();
  var pos = active.indexOf(index);
  if(pos === -1) return active.length ? active[0] : index;
  var len = active.length;
  var newPos = ((pos + dir*steps) % len + len) % len;
  return active[newPos];
}
function seatLeft(index){ return stepFrom(index, 1, 1); }
function seatRight(index){ return stepFrom(index, 1, -1); }

function clearTimer(){
  if(timerHandle){ clearTimeout(timerHandle); timerHandle = null; }
  if(timerRaf){ cancelAnimationFrame(timerRaf); timerRaf = null; }
  timerPaused = false;
}
function vibrate(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatTimerValue(v){ return v+'s'; }
function firstName(i){ return state.players[i].name; }

function startTimer(barEl, onExpire){
  clearTimer();
  timerBarElCurrent = barEl;
  timerOnExpireCurrent = onExpire;
  runTimerFor(state.timerSeconds*1000);
}
function runTimerFor(durationMs){
  var barEl = timerBarElCurrent;
  var onExpire = timerOnExpireCurrent;
  var start = performance.now();
  timerRemainingMs = durationMs;
  function frame(now){
    var elapsed = now - start;
    var remaining = Math.max(0, durationMs - elapsed);
    timerRemainingMs = remaining;
    if(barEl) barEl.style.width = (remaining/durationMs*100)+'%';
    if(remaining > 0){ timerRaf = requestAnimationFrame(frame); }
  }
  timerRaf = requestAnimationFrame(frame);
  timerHandle = setTimeout(function(){ timerHandle = null; onExpire(); }, durationMs);
}
/* Met le décompte en pause (ex : pendant qu'on choisit qui éliminer via "NON"),
   sans perdre le temps déjà écoulé — reprendra exactement où il en était. */
function pauseTimer(){
  if(timerPaused || (!timerHandle && !timerRaf)) return;
  timerPaused = true;
  if(timerHandle){ clearTimeout(timerHandle); timerHandle = null; }
  if(timerRaf){ cancelAnimationFrame(timerRaf); timerRaf = null; }
}
function resumeTimer(){
  if(!timerPaused) return;
  timerPaused = false;
  if(!timerBarElCurrent || timerRemainingMs <= 0) return;
  runTimerFor(timerRemainingMs);
}

/* Termine réellement l'élimination (après l'animation plein écran) et fait avancer le jeu. */
function finalizeElimination(index){
  var wasCurrentHolder = (index === state.current);
  var next = wasCurrentHolder ? stepFrom(index, 1, state.direction) : state.current;
  state.players[index].eliminated = true;
  state.caribou = null;
  var remaining = activePositions();
  if(remaining.length <= 1){
    var survivor = remaining[0];
    state.current = survivor;
    state.players[survivor].wins++;
    playVictoryAnimation(survivor, function(){
      if(state.players[survivor].wins >= WINS_TO_WIN_GAME){
        renderGameOver(survivor);
      } else if(state.rules.malusEnabled){
        renderMalusDesignation(survivor, function(){ renderRoundEnd(); });
      } else {
        renderRoundEnd();
      }
    });
  }
  else {
    state.current = next;
    state.lastActionType = null;
    state.awaitingFirstYa = true; // chaque élimination relance la manche : on repart forcément par un Ya
    renderMain();
  }
}
/* Point d'entrée générique : joue l'animation d'élimination puis finalise. */
function loseTurn(index, reasonText){
  clearTimer(); lockButtons();
  var before = activePositions();
  if(before.length <= 1) return;
  vibrate([60,40,60]);
  playLossAnimation(index, reasonText, function(finalIndex){ finalizeElimination(finalIndex); });
}
function eliminateAndAdvance(index){
  var before = activePositions();
  if(before.length <= 1) return;
  loseTurn(index, pick(SARCASTIC_TIMEOUT, firstName(index)));
}

/* Cas particulier du Caribou : si AUCUN des deux voisins n'a validé à temps, les deux sont éliminés. */
function finalizeDoubleElimination(launcher, idx1, idx2){
  if(!state.players[idx1].eliminated){ state.players[idx1].eliminated = true; }
  if(!state.players[idx2].eliminated){ state.players[idx2].eliminated = true; }
  state.caribou = null;
  var remaining = activePositions();
  if(remaining.length <= 1){
    var survivor = remaining[0];
    state.current = survivor;
    state.players[survivor].wins++;
    playVictoryAnimation(survivor, function(){
      if(state.players[survivor].wins >= WINS_TO_WIN_GAME){
        renderGameOver(survivor);
      } else if(state.rules.malusEnabled){
        renderMalusDesignation(survivor, function(){ renderRoundEnd(); });
      } else {
        renderRoundEnd();
      }
    });
  } else {
    state.current = launcher; // le lanceur n'est pas en cause, c'est lui qui relance la manche
    state.lastActionType = null;
    state.awaitingFirstYa = true;
    renderMain();
  }
}
function loseBothCaribouNeighbors(launcher, leftIdx, rightIdx){
  clearTimer(); lockButtons();
  var before = activePositions();
  if(before.length <= 1) return;
  vibrate([60,40,60,40,90]);
  playDoubleLossAnimation(leftIdx, rightIdx, function(){ finalizeDoubleElimination(launcher, leftIdx, rightIdx); });
}

/* ============================================================
   GEOMETRIE DE LA TABLE
   ============================================================ */
function seatAngleDeg(i, total){ return -90 + i*(360/total); }
function seatXY(angleDeg, R){ var rad = angleDeg*Math.PI/180; return { x: 50 + R*Math.cos(rad), y: 50 + R*Math.sin(rad) }; }
function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

/* ---------- Mode d'affichage : table fixe VS joueur actif toujours en bas ---------- */
var lastTableRotation = 0;
function tableOffsetForCurrent(){
  if(state.displayMode !== 'rotate') return 0;
  var total = state.players.length;
  if(!total) return 0;
  return 90 - seatAngleDeg(state.current, total);
}
/* Ajuste `target` par multiples de 360° pour rester au plus proche de `reference`,
   afin que la table tourne toujours par le chemin le plus court (jamais un tour complet inutile). */
function normalizeContinuous(target, reference){
  var diff = ((target - reference) % 360 + 540) % 360 - 180;
  return reference + diff;
}
/* Fait pivoter visuellement la table (et les sièges, contre-pivotés pour rester lisibles)
   de l'ancienne orientation vers la nouvelle, en douceur. Ne fait rien en mode "table fixe". */
function applyTableRotation(){
  if(state.displayMode !== 'rotate'){ lastTableRotation = 0; return; }
  var wrap = document.getElementById('tableWrap');
  if(!wrap) return;
  var target = normalizeContinuous(tableOffsetForCurrent(), lastTableRotation);
  var items = wrap.querySelectorAll('.seat, .table-center');
  wrap.style.transition = 'none';
  wrap.style.transform = 'rotate('+lastTableRotation+'deg)';
  for(var i=0;i<items.length;i++){
    items[i].style.transition = 'none';
    var base = items[i].getAttribute('data-base-transform') || '';
    items[i].style.transform = base+' rotate('+(-lastTableRotation)+'deg)';
  }
  void wrap.offsetWidth; // force reflow avant de lancer la transition
  wrap.style.transition = 'transform .6s cubic-bezier(.4,0,.2,1)';
  wrap.style.transform = 'rotate('+target+'deg)';
  for(var j=0;j<items.length;j++){
    var el = items[j];
    var base2 = el.getAttribute('data-base-transform') || '';
    el.style.transition = 'transform .6s cubic-bezier(.4,0,.2,1)';
    el.style.transform = base2+' rotate('+(-target)+'deg)';
  }
  lastTableRotation = target;
}
function easeOutBack(t){ var c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }

function buildTableHTML(opts){
  opts = opts || {};
  var total = state.players.length;
  var html = '<div class="table-wrap" id="tableWrap">';
  html += '<div class="table-center" data-base-transform="translate(-50%,-50%)" style="transform:translate(-50%,-50%);"><button class="non-btn" id="nonBtn">NON</button><div class="center-round">MANCHE '+state.roundNumber+'</div></div>';
  for(var i=0;i<total;i++){
    var ang = seatAngleDeg(i, total);
    var xy = seatXY(ang, 40);
    var p = state.players[i];
    var cls2 = 'seat';
    if(p.eliminated) cls2 += ' out';
    else if(i === state.current && !opts.hideHolder) cls2 += ' holder';
    if(opts.clickable && opts.clickable.indexOf(i) !== -1) cls2 += ' clickable';
    var initials = p.name.trim().slice(0,2).toUpperCase();
    html += '<div class="'+cls2+'" data-idx="'+i+'" data-base-transform="translate(-50%,-50%)" style="left:'+xy.x+'%;top:'+xy.y+'%;transform:translate(-50%,-50%);" title="'+escapeHtml(p.name)+'">';
    html += p.eliminated ? '' : initials;
    if(p.malusTier > 0) html += '<span class="badge">'+p.malusTier+'</span>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}
function seatEl(idx){ return app.querySelector('.seat[data-idx="'+idx+'"]'); }

function angleDeltaTo(fromAngle, toAngle, dir){
  var raw = ((toAngle - fromAngle) % 360 + 360) % 360;
  if(dir === 1) return raw === 0 ? 360 : raw;
  return raw === 0 ? -360 : raw - 360;
}
function shortestAngleDelta(fromAngle, toAngle){
  var cw = angleDeltaTo(fromAngle, toAngle, 1);
  var ccw = angleDeltaTo(fromAngle, toAngle, -1);
  return Math.abs(cw) <= Math.abs(ccw) ? cw : ccw;
}
function animateToken(fromIdx, toIdx, dir, duration, easing, emoji, fireTrail, onDone, longSweep){
  var wrap = document.getElementById('tableWrap');
  if(!wrap){ onDone && onDone(); return; }
  var total = state.players.length;
  var token = document.createElement('div');
  token.className = 'ball-token' + (fireTrail ? ' blur' : '');
  token.textContent = emoji;
  wrap.appendChild(token);
  var fromAngle = seatAngleDeg(fromIdx, total);
  var toRealAngle = seatAngleDeg(toIdx, total);
  var delta;
  if(longSweep){
    var shortOpposite = angleDeltaTo(fromAngle, toRealAngle, -dir);
    delta = shortOpposite + 360*dir;
  } else if(dir === 0){
    delta = shortestAngleDelta(fromAngle, toRealAngle);
  } else {
    delta = angleDeltaTo(fromAngle, toRealAngle, dir);
  }
  var toAngle = fromAngle + delta;
  var start = performance.now();
  var lastSpark = 0;
  function frame(now){
    var t = Math.min(1, (now-start)/duration);
    var eased = easing(t);
    var ang = fromAngle + (toAngle-fromAngle)*eased;
    var xy = seatXY(ang, 40);
    token.style.left = xy.x+'%'; token.style.top = xy.y+'%';
    if(fireTrail && now-lastSpark > 60){
      lastSpark = now;
      var spark = document.createElement('div');
      spark.className = 'spark';
      spark.textContent = Math.random()>0.5 ? '✨' : '🔥';
      spark.style.left = xy.x+'%'; spark.style.top = xy.y+'%';
      wrap.appendChild(spark);
      setTimeout(function(){ spark.remove(); }, 520);
    }
    if(t < 1){ requestAnimationFrame(frame); }
    else { token.remove(); onDone && onDone(); }
  }
  requestAnimationFrame(frame);
}
/* Corrige le "mini lag" perçu : dès que le jeton arrive, on bascule immédiatement
   le halo du porteur sur le nouveau siège, sans attendre le prochain rendu complet. */
function moveHolderHighlight(oldIdx, newIdx){
  var oldEl = seatEl(oldIdx); if(oldEl) oldEl.classList.remove('holder');
  var newEl = seatEl(newIdx); if(newEl) newEl.classList.add('holder');
}

/* Bouton "NON" au centre de la table : élimine un joueur de la manche en cours
   pour non-respect des règles, décidé collectivement autour de la table. */
function wireNonButton(){
  var btn = document.getElementById('nonBtn');
  if(btn) btn.onclick = showNonChooser;
}
function showNonChooser(){
  pauseTimer();
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  var active = activePositions();
  var gridHtml = '';
  for(var i=0;i<active.length;i++){
    gridHtml += '<button class="contest-target" data-idx="'+active[i]+'">'+escapeHtml(firstName(active[i]))+'</button>';
  }
  overlay.innerHTML =
    '<div class="modal-card">'+
      '<div class="modal-head"><h2>🚫 Non !</h2><button class="icon-btn" id="closeNon">✕</button></div>'+
      '<div class="modal-body">'+
        '<p>Qui ne respecte pas les règles et doit être éliminé de cette manche ?</p>'+
        '<div class="contest-grid">'+gridHtml+'</div>'+
      '</div>'+
    '</div>';
  document.body.appendChild(overlay);
  document.getElementById('closeNon').onclick = function(){ overlay.remove(); resumeTimer(); };
  overlay.onclick = function(e){ if(e.target===overlay){ overlay.remove(); resumeTimer(); } };
  var btns = overlay.querySelectorAll('.contest-target');
  for(var j=0;j<btns.length;j++){
    btns[j].onclick = function(){
      var idx = +this.getAttribute('data-idx');
      overlay.remove();
      loseTurn(idx, 'Éliminé(e) sur décision collective pour non-respect des règles.');
    };
  }
}

/* Cadre de flammes autour de l'écran, affiché pendant le vol de la Boule de feu.
   Une SEULE bande continue par bord (un seul dégradé partagé), mais découpée en une rangée
   de flammes qui se touchent à la base (creux peu profonds) et pointent vers le centre
   (sommets bien marqués), plutôt qu'une simple vague lisse ou des flammèches détachées. */
/* ============================================================
   ACTIONS
   ============================================================ */
function shuffleArray(arr){
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  }
  return arr;
}
/* Palier de malus (0-5) : 1=aucun effet, 2=flou léger, 3=flou prononcé,
   4=flou + vibration, 5=flou + vibration + boutons mélangés (le mélange lui-même
   est fait au moment de construire les boutons, avant l'appel à cette fonction). */
function applyMalusEffects(containerSelector, tier){
  tier = tier || 0;
  var blurByTier = [0, 0, 1.5, 2.5, 3, 2];
  var blurPx = blurByTier[Math.min(tier, 5)];
  var container = document.querySelector(containerSelector);
  if(container){
    container.style.filter = blurPx > 0 ? 'blur('+blurPx+'px)' : '';
    container.classList.toggle('malus-shake', tier >= 3);
  }
  if(tier >= 3) vibrate([30,25,30]);
}
function lockButtons(){
  var btns = app.querySelectorAll('.action-btn, .icon-btn, .car-btn');
  for(var i=0;i<btns.length;i++) btns[i].style.pointerEvents = 'none';
}
function setCaption(text){ var c = document.getElementById('captionEl'); if(c) c.textContent = text; }

function doFirstYa(dirChoice){
  clearTimer(); lockButtons();
  var from = state.current;
  state.direction = dirChoice;
  var to = stepFrom(from, 1, dirChoice);
  setCaption('✋ '+firstName(from)+' fait un Ya '+(dirChoice===1?'gauche':'droite')+'…');
  animateToken(from, to, dirChoice, ACTION_ANIM_MS, easeInOutCubic, '✋', false, function(){
    moveHolderHighlight(from, to);
    state.current = to;
    state.awaitingFirstYa = false;
    state.lastActionType = 'ya';
    state.lastActionEmoji = '✋';
    state.lastActionTilt = dirChoice===1 ? 'tilt-left' : 'tilt-right';
    state.lastActionMirror = false;
    state.lastActionText = '✋ '+firstName(from)+' → '+firstName(to);
    setTimeout(renderMain, CAPTION_HOLD_MS);
  });
}
/* Quand la règle "sens de la main" est active, le joueur choisit lui-même quelle
   main/bras il a mimé. S'il se trompe (par rapport au sens réel de la balle), il perd —
   volontairement laissé possible, comme pour les autres règles maison. */
function doYaSide(side){
  var correctSide = state.direction === 1 ? 'right' : 'left';
  if(side !== correctSide){
    loseTurn(state.current, sarcasticWrongHand(firstName(state.current), 'Ya'));
    return;
  }
  doYa();
}
function doDoumeSide(side){
  if(checkOnlyYaAfterCaribou('Doumé')) return;
  var correctSide = state.direction === 1 ? 'right' : 'left';
  if(side !== correctSide){
    loseTurn(state.current, sarcasticWrongHand(firstName(state.current), 'Doumé'));
    return;
  }
  doDoume();
}
function doYa(){
  clearTimer(); lockButtons();
  var from = state.current, dir = state.direction;
  var to = stepFrom(from, 1, dir);
  setCaption('✋ '+firstName(from)+' passe la balle à '+firstName(to)+'…');
  animateToken(from, to, dir, ACTION_ANIM_MS, easeInOutCubic, '✋', false, function(){
    moveHolderHighlight(from, to);
    state.current = to;
    state.lastActionType = 'ya';
    state.lastActionEmoji = '✋';
    state.lastActionTilt = dir===1 ? 'tilt-left' : 'tilt-right';
    state.lastActionMirror = false;
    state.lastActionText = '✋ '+firstName(from)+' → '+firstName(to);
    setTimeout(renderMain, CAPTION_HOLD_MS);
  });
}
function doOuzbeb(){
  if(checkOnlyYaAfterCaribou('Ouzbeb')) return;
  if(state.rules.noOuzbebOnDoume && state.lastActionType === 'doume'){
    loseTurn(state.current, pick(SARCASTIC_OUZBEB_ON_DOUME, firstName(state.current)));
    return;
  }
  clearTimer(); lockButtons();
  var from = state.current, dir = state.direction;
  var skipped = stepFrom(from, 1, dir);
  var to = stepFrom(from, 2, dir);
  var selfReturn = (to === from);
  setCaption(selfReturn
    ? '🙆‍♂️ '+firstName(from)+' saute '+firstName(skipped)+' et repart avec la balle !'
    : '🙆‍♂️ '+firstName(from)+' saute '+firstName(skipped)+' et vise '+firstName(to)+' !');
  animateToken(from, to, dir, ACTION_ANIM_MS+150, easeInOutCubic, '🙆‍♂️', false, function(){
    moveHolderHighlight(from, to);
    state.current = to;
    state.lastActionType = 'ouzbeb';
    state.lastActionEmoji = '🙆‍♂️';
    state.lastActionTilt = '';
    state.lastActionMirror = false;
    state.lastActionText = selfReturn
      ? '🙆‍♂️ '+firstName(from)+' rejoue (à deux, le saut revient au lanceur)'
      : '🙆‍♂️ '+firstName(from)+' saute '+firstName(skipped)+' → '+firstName(to);
    setTimeout(renderMain, CAPTION_HOLD_MS);
  });
}
function doDoume(){
  if(checkOnlyYaAfterCaribou('Doumé')) return;
  if(state.rules.noDoumeOnDoume && state.lastActionType === 'doume'){
    loseTurn(state.current, pick(SARCASTIC_DOUME_ON_DOUME, firstName(state.current)));
    return;
  }
  clearTimer(); lockButtons();
  var from = state.current;
  state.direction *= -1;
  var newDir = state.direction;
  var to = stepFrom(from, 1, newDir);
  setCaption('💪 '+firstName(from)+' contre ! Le sens s\'inverse…');
  animateToken(from, to, newDir, ACTION_ANIM_MS, easeOutBack, '💪', false, function(){
    moveHolderHighlight(from, to);
    state.current = to;
    state.lastActionType = 'doume';
    state.lastActionEmoji = '💪';
    state.lastActionTilt = '';
    state.lastActionMirror = newDir === -1;
    state.lastActionText = '💪 '+firstName(from)+' inverse le sens → '+firstName(to);
    setTimeout(renderMain, CAPTION_HOLD_MS);
  });
}
function doBouleDeFeuSide(side){
  if(checkOnlyYaAfterCaribou('Boule de feu')) return;
  var correctSide = state.direction === 1 ? 'right' : 'left';
  if(side !== correctSide){
    loseTurn(state.current, sarcasticWrongHand(firstName(state.current), 'Boule de feu'));
    return;
  }
  doBouleDeFeu();
}
function doBouleDeFeu(){
  if(checkOnlyYaAfterCaribou('Boule de feu')) return;
  clearTimer(); lockButtons();
  var from = state.current, dir = state.direction;
  var to = stepFrom(from, 1, -dir);
  setCaption('☄️ '+firstName(from)+' envoie une boule de feu…');
  animateToken(from, to, dir, FIRE_ANIM_MS, function(t){return t;}, '☄️', true, function(){
    moveHolderHighlight(from, to);
    state.current = to;
    state.lastActionType = 'feu';
    state.lastActionEmoji = '☄️';
    state.lastActionTilt = '';
    state.lastActionMirror = dir === -1;
    state.lastActionText = '☄️ '+firstName(from)+' atterrit sur '+firstName(to);
    setTimeout(renderMain, CAPTION_HOLD_MS);
  });
}
function doCaribouStart(){
  if(checkOnlyYaAfterCaribou('Caribou')) return;
  clearTimer(); lockButtons();
  var launcher = state.current;
  var leftIndex = seatLeft(launcher);
  var rightIndex = seatRight(launcher);
  state.caribou = { launcher: launcher, leftIndex: leftIndex, rightIndex: rightIndex, leftDone:false, rightDone:false };
  setCaption('🫎 '+firstName(launcher)+' lance un Caribou !');
  setTimeout(renderCaribouConfirm, CAPTION_HOLD_MS);
}

/* ============================================================
   RENDER — CONFIG SCREEN
   ============================================================ */
var configCount = 5;
var configNames = [];
var configTimerSeconds = DEFAULT_TIMER_S;
var configRules = { noDoumeOnDoume:true, noOuzbebOnDoume:true, handRule:true, onlyYaAfterCaribou:true, malusEnabled:true };
var configDisplayMode = 'fixed';

function renderConfig(){
  clearTimer();
  state.screen = 'config';
  if(configNames.length === 0){ for(var i=0;i<configCount;i++) configNames.push(''); }
  var html = '';
  html += '<div class="screen">';
  html += '<h1 class="brand">YA.</h1>';
  html += '<p class="sub">Un seul téléphone, une table, aucune pitié.</p>';
  html += '<div class="config-scroll">';

  html += '<label class="field-label">Nombre de joueurs</label>';
  html += '<div class="stepper"><button id="btnMinus" type="button">−</button><span class="count" id="countVal">'+configCount+'</span><button id="btnPlus" type="button">+</button></div>';

  html += '<label class="field-label">Prénoms</label>';
  html += '<div class="name-list" id="nameList"></div>';

  html += '<label class="field-label">Temps par tour</label>';
  html += '<div class="stepper"><button id="timeMinus" type="button">−</button><span class="count" id="timeVal">'+formatTimerValue(configTimerSeconds)+'</span><button id="timePlus" type="button">+</button></div>';

  html += '<label class="field-label">Affichage de la table</label>';
  html += '<div class="mode-toggle" id="modeToggle">';
  html += '<button class="mode-opt'+(configDisplayMode==='fixed'?' active':'')+'" data-mode="fixed">🪑 Table fixe</button>';
  html += '<button class="mode-opt'+(configDisplayMode==='rotate'?' active':'')+'" data-mode="rotate">🔄 Joueur en bas</button>';
  html += '</div>';

  html += '<label class="field-label">Règles de la partie</label>';
  html += '<div id="ruleList">'+buildRuleTogglesHTML()+'</div>';

  html += '<button class="ghost-btn" id="rulesBtn" type="button">📖 Voir les règles du jeu</button>';

  html += '<div class="error-msg" id="errMsg"></div>';
  html += '</div>';
  html += '<button class="primary-btn" id="startBtn" type="button">Lancer la partie 🔥</button>';
  html += '</div>';
  app.innerHTML = html;
  buildNameInputs();
  wireRuleToggles();
  document.getElementById('rulesBtn').onclick = function(){ showRulesModal(configRules); };
  var modeBtns = document.querySelectorAll('.mode-opt');
  for(var m=0;m<modeBtns.length;m++){
    modeBtns[m].onclick = function(){
      configDisplayMode = this.dataset.mode;
      var all = document.querySelectorAll('.mode-opt');
      for(var k=0;k<all.length;k++) all[k].classList.toggle('active', all[k].dataset.mode===configDisplayMode);
    };
  }

  document.getElementById('btnMinus').onclick = function(){ if(configCount > 2){ configCount--; adjustNamesArray(); refreshCountAndNames(); } };
  document.getElementById('btnPlus').onclick = function(){ if(configCount < 20){ configCount++; adjustNamesArray(); refreshCountAndNames(); } };
  document.getElementById('timeMinus').onclick = function(){
    var idx = TIMER_STEPS.indexOf(configTimerSeconds);
    if(idx > 0){ configTimerSeconds = TIMER_STEPS[idx-1]; document.getElementById('timeVal').textContent = formatTimerValue(configTimerSeconds); }
  };
  document.getElementById('timePlus').onclick = function(){
    var idx = TIMER_STEPS.indexOf(configTimerSeconds);
    if(idx < TIMER_STEPS.length-1){ configTimerSeconds = TIMER_STEPS[idx+1]; document.getElementById('timeVal').textContent = formatTimerValue(configTimerSeconds); }
  };
  document.getElementById('startBtn').onclick = onStartGame;
}
function buildRuleTogglesHTML(){
  var html = '';
  for(var i=0;i<RULE_DEFS.length;i++){
    var r = RULE_DEFS[i];
    var on = configRules[r.key];
    html += '<div class="toggle-row" data-key="'+r.key+'">';
    html += '<div><div class="t-label">'+r.label+'</div><div class="t-desc">'+r.desc+'</div></div>';
    html += '<div class="switch'+(on?' on':'')+'" data-key="'+r.key+'"><div class="knob"></div></div>';
    html += '</div>';
  }
  return html;
}
function wireRuleToggles(){
  var switches = document.querySelectorAll('.switch');
  for(var i=0;i<switches.length;i++){
    switches[i].onclick = function(){
      var key = this.dataset.key;
      configRules[key] = !configRules[key];
      this.classList.toggle('on', configRules[key]);
    };
  }
}
function adjustNamesArray(){ while(configNames.length < configCount) configNames.push(''); while(configNames.length > configCount) configNames.pop(); }
function refreshCountAndNames(){ document.getElementById('countVal').textContent = configCount; buildNameInputs(); }
function buildNameInputs(){
  var list = document.getElementById('nameList');
  var html = '';
  for(var i=0;i<configCount;i++){
    html += '<div class="name-row"><span class="num">'+(i+1)+'</span><input class="grow" type="text" maxlength="16" placeholder="Joueur '+(i+1)+'" data-idx="'+i+'" value="'+escapeHtml(configNames[i]||'')+'"></div>';
  }
  list.innerHTML = html;
  var inputs = list.querySelectorAll('input');
  for(var j=0;j<inputs.length;j++){ inputs[j].oninput = function(e){ configNames[+e.target.dataset.idx] = e.target.value; }; }
}
function onStartGame(){
  var err = document.getElementById('errMsg');
  if(configCount < MIN_PLAYERS){ err.textContent = 'Il faut au moins '+MIN_PLAYERS+' joueurs.'; return; }
  state.players = [];
  for(var i=0;i<configCount;i++){
    var nm = (configNames[i]||'').trim() || ('Joueur '+(i+1));
    state.players.push({ name: nm, wins: 0, malusTier: 0, eliminated: false });
  }
  state.direction = 1; state.current = 0; state.roundNumber = 1; state.lastActionText = '';
  state.lastActionType = null; state.lastActionEmoji=''; state.lastActionTilt=''; state.lastActionMirror=false;
  state.awaitingFirstYa = true;
  state.rules = { noDoumeOnDoume:configRules.noDoumeOnDoume, noOuzbebOnDoume:configRules.noOuzbebOnDoume, handRule:configRules.handRule, onlyYaAfterCaribou:configRules.onlyYaAfterCaribou, malusEnabled:configRules.malusEnabled };
  state.displayMode = configDisplayMode;
  lastTableRotation = 0;
  state.timerSeconds = configTimerSeconds;
  playCountdownAnimation(function(){ renderMain(); });
}

/* ============================================================
   RENDER — MAIN SCREEN
   ============================================================ */
function renderMain(){
  state.screen = 'main';
  if(state.awaitingFirstYa){ renderFirstMove(); return; }

  var activeCount = activePositions().length;
  var canOuzbeb = activeCount >= 2;
  var canCaribou = activeCount >= 3;
  var holder = state.players[state.current];

  var html = '<div class="screen">';
  html += topbarHTML();
  html += buildTableHTML();

  html += '<div class="holder-strip">';
  html += '<div class="holder-sub">A le téléphone 📱</div>';
  html += '<div class="holder-name">'+escapeHtml(holder.name)+'</div>';
  html += '</div>';
  html += '<div class="timer-bar-wrap"><i id="timerBar"></i></div>';
  html += '<div class="caption" id="captionEl">'+(state.lastActionText ? '<span class="caption last">'+state.lastActionText+'</span>' : '')+'</div>';

  var yaLeftBtn, yaRightBtn, doumeLeftBtn, doumeRightBtn, feuLeftBtn, feuRightBtn, yaSingle, doumeSingle, feuSingle;
  if(state.rules.handRule){
    yaLeftBtn = '<button class="action-btn" id="actYaLeft"><span class="icon-chip chip-ya"><span class="emo tilt-left">✋</span><span class="arrow-badge">⬅️</span></span><span class="lbl">Ya gauche</span></button>';
    yaRightBtn = '<button class="action-btn" id="actYaRight"><span class="icon-chip chip-ya"><span class="emo tilt-right">✋</span><span class="arrow-badge">➡️</span></span><span class="lbl">Ya droite</span></button>';
    doumeLeftBtn = '<button class="action-btn" id="actDoumeLeft"><span class="icon-chip chip-doume"><span class="emo">💪</span><span class="arrow-badge">⬅️</span></span><span class="lbl">Doumé gauche</span></button>';
    doumeRightBtn = '<button class="action-btn" id="actDoumeRight"><span class="icon-chip chip-doume"><span class="emo mirror">💪</span><span class="arrow-badge">➡️</span></span><span class="lbl">Doumé droite</span></button>';
    feuLeftBtn = '<button class="action-btn" id="actFeuLeft"><span class="icon-chip chip-feu"><span class="emo">☄️</span><span class="arrow-badge">⬅️</span></span><span class="lbl">Boule de feu gauche</span></button>';
    feuRightBtn = '<button class="action-btn" id="actFeuRight"><span class="icon-chip chip-feu"><span class="emo mirror">☄️</span><span class="arrow-badge">➡️</span></span><span class="lbl">Boule de feu droite</span></button>';
  } else {
    yaSingle = '<button class="action-btn" id="actYa"><span class="icon-chip chip-ya"><span class="emo '+(state.direction===1?'tilt-left':'tilt-right')+'">✋</span></span><span class="lbl">Ya</span></button>';
    doumeSingle = '<button class="action-btn" id="actDoume"><span class="icon-chip chip-doume"><span class="emo">💪</span></span><span class="lbl">Doumé</span></button>';
    feuSingle = '<button class="action-btn" id="actFeu"><span class="icon-chip chip-feu"><span class="emo">☄️</span></span><span class="lbl">Boule de feu</span></button>';
  }

  var btnList = [];
  if(state.rules.handRule){
    btnList.push(yaLeftBtn, yaRightBtn, doumeLeftBtn, doumeRightBtn, feuLeftBtn, feuRightBtn);
  } else {
    btnList.push(yaSingle, doumeSingle, feuSingle);
  }
  btnList.push('<button class="action-btn '+(canOuzbeb?'':'disabled')+'" id="actOuzbeb"><span class="icon-chip chip-ouzbeb"><span class="emo">🙆‍♂️</span></span><span class="lbl">Ouzbeb</span></button>');
  btnList.push('<button class="action-btn '+(canCaribou?'':'disabled')+'" id="actCaribou"><span class="icon-chip chip-caribou"><span class="emo">🫎</span></span><span class="lbl">Caribou</span></button>');

  var holderTier = holder.malusTier || 0;
  if(holderTier >= 5) shuffleArray(btnList);

  html += '<div class="actions">';
  html += btnList.join('');
  html += '</div>';
  html += '</div>';

  app.innerHTML = html;
  applyTableRotation();
  wireNonButton();
  wireTopbar();
  applyMalusEffects('.actions', holderTier);

  if(state.rules.handRule){
    document.getElementById('actYaLeft').onclick = function(){ doYaSide('right'); };
    document.getElementById('actYaRight').onclick = function(){ doYaSide('left'); };
    document.getElementById('actDoumeLeft').onclick = function(){ doDoumeSide('left'); };
    document.getElementById('actDoumeRight').onclick = function(){ doDoumeSide('right'); };
    document.getElementById('actFeuLeft').onclick = function(){ doBouleDeFeuSide('right'); };
    document.getElementById('actFeuRight').onclick = function(){ doBouleDeFeuSide('left'); };
  } else {
    document.getElementById('actYa').onclick = doYa;
    document.getElementById('actDoume').onclick = doDoume;
    document.getElementById('actFeu').onclick = doBouleDeFeu;
  }
  if(canOuzbeb) document.getElementById('actOuzbeb').onclick = doOuzbeb;
  else document.getElementById('actOuzbeb').onclick = function(){};
  if(canCaribou) document.getElementById('actCaribou').onclick = doCaribouStart;

  startTimer(document.getElementById('timerBar'), function(){ eliminateAndAdvance(state.current); });
}

function topbarHTML(){

function wireTopbar(){

function showScoreboardModal(){

    '<div class="modal-card">'+
      '<div class="modal-head"><h2>🏆 Classement</h2><button class="icon-btn" id="closeScores">✕</button></div>'+

function confirmFullReset(){

}
function showRulesModal(rulesSource){
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  var r = rulesSource || state.rules;
  var active = [];
  if(r.noDoumeOnDoume) active.push('🚫 Doumé sur Doumé = élimination directe');
  if(r.noOuzbebOnDoume) active.push('🚫 Ouzbeb sur Doumé = élimination directe');
  if(r.handRule) active.push('🔄 Ya, Doumé et Boule de feu doivent être joués du bon côté selon le sens de la balle');
  if(r.onlyYaAfterCaribou) active.push('🫎 Après un Caribou, seul un Ya est autorisé (toute autre action élimine)');
  if(r.malusEnabled) active.push('📈 Malus progressifs activés (voir ci-dessous)');
  var activeHtml = active.length ? ('<hr><p><b>Règles maison actives :</b></p><ul>'+active.map(function(a){return '<li>'+a+'</li>';}).join('')+'</ul>') : '';
  overlay.innerHTML =
    '<div class="modal-card">'+
      '<div class="modal-head"><h2>Règles du jeu</h2><button class="icon-btn" id="closeRules">✕</button></div>'+
      '<div class="modal-body">'+
        '<p><b>✋ Ya</b> — passe la balle au joueur suivant dans le sens actuel.</p>'+
        '<p><b>🙆‍♂️ Ouzbeb</b> — saute le joueur suivant, la balle va au 2ème (à deux joueurs, elle revient au lanceur qui rejoue).</p>'+
        '<p><b>💪 Doumé</b> — inverse le sens et renvoie la balle vers le joueur précédent.</p>'+
        '<p><b>☄️ Boule de feu</b> — traverse tout le cercle et atterrit sur le dernier joueur (peut être envoyée à gauche ou à droite).</p>'+
        '<p><b>🫎 Caribou</b> — les deux voisins valident leur position (gauche puis droite), puis le lanceur choisit librement sa cible, même lui-même. Après un Caribou, seul un Ya peut être joué.</p>'+
        '<p><b>🚫 NON</b> — bouton au centre de la table : élimine n\'importe quel joueur de la manche en cours en cas de non-respect des règles. Il revient dès la manche suivante.</p>'+
        '<p><b>🏆 Victoire</b> — chaque manche a un survivant qui gagne 1 point ; le premier à '+WINS_TO_WIN_GAME+' points remporte la partie.</p>'+
        '<p><b>📈 Malus</b> — si activé, le vainqueur de chaque manche désigne un joueur qui monte d\'un palier (1: rien, 2: flou, 3-4: flou + vibration, 5 et au-delà: flou + vibration + boutons mélangés).</p>'+
        activeHtml+
      '</div>'+
    '</div>';
  document.body.appendChild(overlay);
  document.getElementById('closeRules').onclick = function(){ overlay.remove(); };
  overlay.onclick = function(e){ if(e.target===overlay) overlay.remove(); };
}

/* ============================================================
   OVERLAYS PLEIN ÉCRAN — Caribou scellé / élimination
   ============================================================ */
function playCaribouSealAnimation(onDone){
  var overlay = document.createElement('div');
  overlay.className = 'seal-overlay';
  overlay.innerHTML =
    '<div class="seal-cluster" id="sealCluster">'+
      '<span class="seal-char left">🙋</span>'+
      '<span class="seal-caribou">🫎</span>'+
      '<span class="seal-char right">🙋</span>'+
      '<div class="seal-caption" id="sealCaption">C\'est scellé !</div>'+
    '</div>';
  document.body.appendChild(overlay);
  vibrate(30);
  setTimeout(function(){
    var cluster = document.getElementById('sealCluster'); if(cluster) cluster.classList.add('sealed');
    var cap = document.getElementById('sealCaption'); if(cap) cap.classList.add('show');
    vibrate([40,30,60]);
  }, SEAL_ARRIVE_MS);
  setTimeout(function(){ overlay.classList.add('leaving'); }, SEAL_ARRIVE_MS + SEAL_SHAKE_MS + SEAL_HOLD_MS);
  setTimeout(function(){ overlay.remove(); onDone && onDone(); }, SEAL_ARRIVE_MS + SEAL_SHAKE_MS + SEAL_HOLD_MS + SEAL_FADE_MS);
}
function playLossAnimation(index, reasonText, onDone){
  var current = index;
  var overlay = document.createElement('div');
  overlay.className = 'loss-overlay';
  overlay.innerHTML = '<div class="loss-cluster" id="lossCluster">'+mainInner(current, reasonText)+'</div>';
  document.body.appendChild(overlay);
  wireMain();

  function mainInner(idx, reason){
    return '<div class="loss-emoji">💩</div>'+
      '<div class="loss-name">'+escapeHtml(firstName(idx))+' est éliminé(e) de la manche !</div>'+
      '<div class="loss-reason">'+escapeHtml(reason)+'</div>'+
      '<div class="loss-btn-row">'+
        '<button class="overlay-continue-btn" id="lossContinueBtn">Continuer ▶</button>'+
        '<button class="overlay-contest-btn" id="lossContestBtn">⚖️ Contester</button>'+
      '</div>';
  }
  function wireMain(){
    document.getElementById('lossContinueBtn').onclick = function(){
      overlay.classList.add('leaving');
      setTimeout(function(){ overlay.remove(); onDone && onDone(current); }, LOSS_FADE_MS);
    };
    document.getElementById('lossContestBtn').onclick = showChooser;
  }
  function showChooser(){
    var cluster = document.getElementById('lossCluster');
    var active = activePositions();
    var gridHtml = '';
    for(var i=0;i<active.length;i++){
      gridHtml += '<button class="contest-target" data-idx="'+active[i]+'">'+escapeHtml(firstName(active[i]))+'</button>';
    }
    cluster.innerHTML =
      '<div class="loss-emoji" style="font-size:min(20vw,66px);">⚖️</div>'+
      '<div class="loss-name">Qui doit vraiment perdre ?</div>'+
      '<div class="contest-grid">'+gridHtml+'</div>'+
      '<button class="overlay-cancel-btn" id="contestCancelBtn">Annuler</button>';
    var btns = cluster.querySelectorAll('.contest-target');
    for(var j=0;j<btns.length;j++){
      btns[j].onclick = function(){
        current = +this.getAttribute('data-idx');
        cluster.innerHTML = mainInner(current, 'Contestation acceptée : le malus revient à '+firstName(current)+'.');
        wireMain();
      };
    }
    document.getElementById('contestCancelBtn').onclick = function(){
      cluster.innerHTML = mainInner(current, reasonText);
      wireMain();
    };
  }
}
var CONFETTI = ['🎉','✨','🎊','🥳','⭐'];
function playDoubleLossAnimation(idx1, idx2, onDone){
  var overlay = document.createElement('div');
  overlay.className = 'loss-overlay';
  overlay.innerHTML =
    '<div class="loss-cluster">'+
      '<div class="loss-emoji" style="font-size:min(20vw,80px);">💩💩</div>'+
      '<div class="loss-name">'+escapeHtml(firstName(idx1))+' et '+escapeHtml(firstName(idx2))+' sont éliminés !</div>'+
      '<div class="loss-reason">Aucun des deux voisins n\'a validé sa position à temps.</div>'+
      '<button class="overlay-continue-btn" id="doubleLossContinueBtn">Continuer ▶</button>'+
    '</div>';
  document.body.appendChild(overlay);
  document.getElementById('doubleLossContinueBtn').onclick = function(){
    overlay.classList.add('leaving');
    setTimeout(function(){ overlay.remove(); onDone && onDone(); }, LOSS_FADE_MS);
  };
}
function playVictoryAnimation(index, onDone){
  var overlay = document.createElement('div');
  overlay.className = 'victory-overlay';
  var confettiHtml = '';
  for(var i=0;i<16;i++){
    var emo = CONFETTI[Math.floor(Math.random()*CONFETTI.length)];
    var left = Math.random()*100;
    var delay = (Math.random()*0.6).toFixed(2);
    var dur = (2.2 + Math.random()*1.4).toFixed(2);
    confettiHtml += '<span class="confetti" style="left:'+left+'%;animation-delay:'+delay+'s;animation-duration:'+dur+'s;">'+emo+'</span>';
  }
  overlay.innerHTML =
    '<div class="confetti-layer">'+confettiHtml+'</div>'+
    '<div class="victory-cluster">'+
      '<div class="victory-trophy">🏆</div>'+
      '<div class="victory-name">'+escapeHtml(firstName(index))+'</div>'+
      '<div class="victory-sub">remporte la manche !</div>'+
      '<button class="overlay-continue-btn" id="victoryContinueBtn">Continuer ▶</button>'+
    '</div>';
  document.body.appendChild(overlay);
  vibrate([30,20,30,20,60]);
  document.getElementById('victoryContinueBtn').onclick = function(){
    overlay.classList.add('leaving');
    setTimeout(function(){ overlay.remove(); onDone && onDone(); }, LOSS_FADE_MS);
  };
}

/* Décompte plein écran 3-2-1 joué avant chaque début de manche / de partie. */
function playCountdownAnimation(onDone){
  var overlay = document.createElement('div');
  overlay.className = 'countdown-overlay';
  var firstPlayer = state.players[state.current] ? state.players[state.current].name : '';
  overlay.innerHTML =
    '<div class="countdown-cluster">'+
      (firstPlayer ? '<div class="countdown-player">Prépare-toi, '+escapeHtml(firstPlayer)+' !</div>' : '')+
      '<div class="countdown-number" id="countdownNum">3</div>'+
    '</div>';
  document.body.appendChild(overlay);
  var seq = ['3','2','1','C\'est parti !'];
  var idx = 0;
  var numEl = document.getElementById('countdownNum');
  function step(){
    numEl.textContent = seq[idx];
    numEl.classList.toggle('go', seq[idx].indexOf('parti') !== -1);
    numEl.style.animation = 'none';
    void numEl.offsetWidth;
    numEl.style.animation = '';
    vibrate(seq[idx].indexOf('parti') !== -1 ? [40,30,60] : 25);
    idx++;
    if(idx < seq.length){
      setTimeout(step, 650);
    } else {
      setTimeout(function(){
        onDone && onDone(); // met à jour l'écran en dessous PENDANT que l'overlay masque encore tout
        overlay.classList.add('leaving');
        setTimeout(function(){ overlay.remove(); }, 250);
      }, 550);
    }
  }
  step();
}

/* ============================================================
   CARIBOU — écran combiné : les deux voisins valident en même temps,
   chacun déclenche sa propre animation d'arrivée (gauche / droite),
   puis l'animation globale se lance une fois les DEUX validés.
   ============================================================ */
function renderCaribouConfirm(){
  state.screen = 'caribouConfirm';
  var c = state.caribou;
  var html = '<div class="screen">';
  html += '<div class="topbar"><span></span><div class="pill">🫎 Caribou</div><span></span></div>';
  html += buildTableHTML({ hideHolder:true });

  html += '<div class="caribou-stage">';
  html += '<div class="car-side">';
  html += '<div class="car-name">'+escapeHtml(firstName(c.leftIndex))+'</div>';
  html += '<span class="car-icon from-left" id="carIconLeft">🙋</span>';
  html += '<button class="car-btn" id="carLeftBtn"><span class="mirror">🙋‍♂️</span> Main droite</button>';
  html += '<div class="car-check" id="carCheckLeft">✅ Validé</div>';
  html += '</div>';
  html += '<div class="car-center"><div class="car-caribou">🫎</div><div class="car-launcher-lbl">Lanceur</div><div class="car-launcher-name">'+escapeHtml(firstName(c.launcher))+'</div></div>';
  html += '<div class="car-side">';
  html += '<div class="car-name">'+escapeHtml(firstName(c.rightIndex))+'</div>';
  html += '<span class="car-icon from-right" id="carIconRight">🙋</span>';
  html += '<button class="car-btn" id="carRightBtn">🙋‍♂️ Main gauche</button>';
  html += '<div class="car-check" id="carCheckRight">✅ Validé</div>';
  html += '</div>';
  html += '</div>';

  html += '<div class="timer-bar-wrap"><i id="timerBar"></i></div>';
  html += '<div class="hint-tap">Les deux voisins doivent valider leur position</div>';
  html += '</div>';
  app.innerHTML = html;
  applyTableRotation();
  wireNonButton();
  markSeatAsLauncher(c.launcher);

  document.getElementById('carLeftBtn').onclick = function(){ confirmCaribouSide('left'); };
  document.getElementById('carRightBtn').onclick = function(){ confirmCaribouSide('right'); };

  startTimer(document.getElementById('timerBar'), function(){
    var cc = state.caribou;
    if(!cc.leftDone && !cc.rightDone){ loseBothCaribouNeighbors(cc.launcher, cc.leftIndex, cc.rightIndex); }
    else if(!cc.leftDone){ eliminateAndAdvance(cc.leftIndex); }
    else if(!cc.rightDone){ eliminateAndAdvance(cc.rightIndex); }
  });
}

/* Joue l'animation d'arrivée LOCALE du côté concerné, puis, une fois que
   les DEUX voisins ont validé, enchaîne sur l'animation globale plein écran. */
function confirmCaribouSide(side){
  var c = state.caribou;
  vibrate(25);
  if(side === 'left'){
    if(c.leftDone) return;
    c.leftDone = true;
    var btnL = document.getElementById('carLeftBtn'); if(btnL) btnL.style.visibility = 'hidden';
    var iconL = document.getElementById('carIconLeft'); if(iconL) iconL.classList.add('arrived');
    var chkL = document.getElementById('carCheckLeft'); if(chkL) chkL.classList.add('show');
  } else {
    if(c.rightDone) return;
    c.rightDone = true;
    var btnR = document.getElementById('carRightBtn'); if(btnR) btnR.style.visibility = 'hidden';
    var iconR = document.getElementById('carIconRight'); if(iconR) iconR.classList.add('arrived');
    var chkR = document.getElementById('carCheckRight'); if(chkR) chkR.classList.add('show');
  }
  if(c.leftDone && c.rightDone){
    clearTimer(); lockButtons();
    setTimeout(function(){
      playCaribouSealAnimation(function(){ renderCaribouChoose(); });
    }, 500);
  }
}
function markSeatAsLauncher(idx){ var el = seatEl(idx); if(el) el.classList.add('launcher-tag'); }
function markSeatJoined(idx){ var el = seatEl(idx); if(el){ el.style.opacity = '.5'; } }

/* ============================================================
   CARIBOU — étape 3 : le lanceur choisit une cible sur la table (lui inclus)
   ============================================================ */
function renderCaribouChoose(){
  state.screen = 'caribouChoose';
  var c = state.caribou;
  var targets = activePositions();

  var html = '<div class="screen">';
  html += '<div class="topbar"><span></span><div class="pill">🫎 Caribou</div><span></span></div>';
  html += buildTableHTML({ hideHolder:true, clickable: targets });
  html += '<div class="interrupt-text"><h2>'+escapeHtml(firstName(c.launcher))+' reprend le téléphone</h2><p>Choisis librement à qui tu passes la balle : touche un joueur sur la table (toi y compris).</p></div>';
  html += '<div class="timer-bar-wrap"><i id="timerBar"></i></div>';
  html += '<div class="hint-tap">👆 Touche un cercle pour désigner la cible</div>';
  html += '</div>';
  app.innerHTML = html;
  applyTableRotation();
  wireNonButton();
  markSeatAsLauncher(c.launcher);
  markSeatJoined(c.leftIndex);
  markSeatJoined(c.rightIndex);

  for(var i=0;i<targets.length;i++){
    (function(targetIdx){
      var el = seatEl(targetIdx);
      if(el) el.onclick = function(){
        clearTimer(); lockButtons();
        var from = c.launcher;
        setCaption('🫎 '+firstName(from)+' vise '+firstName(targetIdx)+' !');
        animateToken(from, targetIdx, 0, ACTION_ANIM_MS, easeInOutCubic, '🫎', false, function(){
          moveHolderHighlight(from, targetIdx);
          state.current = targetIdx;
          state.caribou = null;
          state.lastActionType = 'caribou';
          state.lastActionEmoji = '🫎';
          state.lastActionTilt = '';
          state.lastActionMirror = false;
          state.lastActionText = '🫎 '+firstName(from)+' → '+firstName(targetIdx)+' (Caribou)';
          setTimeout(renderMain, CAPTION_HOLD_MS);
        });
      };
    })(targets[i]);
  }
  startTimer(document.getElementById('timerBar'), function(){ eliminateAndAdvance(c.launcher); });
}

/* ============================================================
   RENDER — FIN DE MANCHE
   ============================================================ */
var MALUS_TIER_NAMES = ['—', 'Groggy', 'Chancelant', 'Titubant', 'Vaseux', 'Zigzagant'];
function malusTierLabel(tier){
  if(!tier) return '—';
  if(tier <= 5) return MALUS_TIER_NAMES[tier];
  return MALUS_TIER_NAMES[5]+' +'+(tier-5);
}

/* Écran de désignation du malus : le vainqueur de la manche choisit quel autre
   joueur monte d'un palier de malus (uniquement si la règle est active). */
function renderMalusDesignation(winnerIdx, onDone){
  clearTimer();
  state.screen = 'malusDesignation';
  var candidates = [];
  for(var i=0;i<state.players.length;i++){ if(i !== winnerIdx) candidates.push(i); }

  var html = '<div class="screen">';
  html += '<h1 class="brand">Malus</h1>';
  html += '<p class="sub">'+escapeHtml(state.players[winnerIdx].name)+', qui reçoit le malus ?</p>';
  html += '<div class="contest-grid" id="malusGrid" style="max-width:none;">';
  for(var j=0;j<candidates.length;j++){
    var idx = candidates[j];
    var tierNow = state.players[idx].malusTier || 0;
    html += '<button class="contest-target" data-idx="'+idx+'">'+escapeHtml(state.players[idx].name)+'<br><span style="font-size:10.5px;color:var(--ink-dim);font-weight:600;">'+malusTierLabel(tierNow)+' → '+malusTierLabel(tierNow+1)+'</span></button>';
  }
  html += '</div>';
  html += '</div>';
  app.innerHTML = html;

  var btns = document.querySelectorAll('#malusGrid .contest-target');
  for(var k=0;k<btns.length;k++){
    btns[k].onclick = function(){
      var idx2 = +this.getAttribute('data-idx');
      state.players[idx2].malusTier = (state.players[idx2].malusTier||0) + 1;
      onDone && onDone();
    };
  }
}

/* Fin de partie : un joueur a atteint le nombre de victoires requis. */
function renderGameOver(winnerIdx){
  clearTimer();
  state.screen = 'gameOver';
  var sorted = state.players.map(function(p,i){ return {p:p, i:i}; }).sort(function(a,b){ return b.p.wins - a.p.wins; });

  var html = '<div class="screen">';
  html += '<h1 class="brand">Partie terminée</h1>';
  html += '<p class="sub">'+escapeHtml(state.players[winnerIdx].name)+' remporte la partie avec '+state.players[winnerIdx].wins+' victoires 🏆</p>';
  html += '<div class="end-list">';
  for(var k=0;k<sorted.length;k++){
    var p = sorted[k].p, i = sorted[k].i;
    html += '<div class="end-row'+(i===winnerIdx?' winner':'')+'"><span>'+(i===winnerIdx?'<span class="crown">👑</span> ':'')+escapeHtml(p.name)+'</span><span class="score-beers">🏆×'+p.wins+' · '+malusTierLabel(p.malusTier)+'</span></div>';
  }
  html += '</div>';
  html += '<button class="primary-btn" id="newGameBtnFinal">Nouvelle partie</button>';
  html += '</div>';
  app.innerHTML = html;
  document.getElementById('newGameBtnFinal').onclick = function(){ renderConfig(); };
}

function renderRoundEnd(){
  clearTimer();
  state.screen = 'roundEnd';
  var survivor = state.current;
  var sorted = state.players.map(function(p,i){ return {p:p, i:i}; }).sort(function(a,b){ return b.p.wins - a.p.wins; });

  var html = '<div class="screen">';
  html += '<h1 class="brand">Manche terminée</h1>';
  html += '<p class="sub">'+escapeHtml(state.players[survivor].name)+' survit à la manche '+state.roundNumber+' 🏆</p>';
  html += '<div class="end-list">';
  for(var k=0;k<sorted.length;k++){
    var p = sorted[k].p, i = sorted[k].i;
    html += '<div class="end-row'+(i===survivor?' winner':'')+'"><span>'+(i===survivor?'<span class="crown">👑</span> ':'')+escapeHtml(p.name)+'</span><span class="score-beers">🏆×'+p.wins+' · '+malusTierLabel(p.malusTier)+'</span></div>';
  }
  html += '</div>';
  html += '<button class="primary-btn" id="nextRoundBtn">Manche suivante ▶</button>';
  html += '<button class="ghost-btn" id="newGameBtn">Nouvelle partie</button>';
  html += '</div>';
  app.innerHTML = html;

  document.getElementById('nextRoundBtn').onclick = function(){
    for(var i=0;i<state.players.length;i++) state.players[i].eliminated = false;
    state.direction = 1; state.current = survivor; state.roundNumber++; state.lastActionText = '';
    state.lastActionType = null; state.lastActionEmoji=''; state.lastActionTilt=''; state.lastActionMirror=false;
    state.awaitingFirstYa = true;
    playCountdownAnimation(function(){ renderMain(); });
  };
  document.getElementById('newGameBtn').onclick = function(){ renderConfig(); };
}

/* ============================================================
   BOOT
   ============================================================ */
renderConfig();

})();
</script>
